[project]
name = "mojiang-chaogu"
dynamic = ["version"]
description = "可由现有 Agent 接管的本地 A 股 / 美股投研与监控应用"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Cjs5725" }
]
dependencies = [
    "efinance>=0.5.8",
    "pandas>=2.2",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "websockets>=13",
    "jinja2>=3.1.6",
    "openai>=1.0",
    "mcp>=1.28.1",
    "prompt-toolkit>=3.0.51",
    "sqlite-vec>=0.1.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.9",
    "textual>=8.2.8",
    "qrcode>=8.0",
    "cryptography>=50.0.0",
]

[project.scripts]
mojiang-watchlist = "mojiang_chaogu.cli:main_watchlist"
mojiang-monitor = "mojiang_chaogu.cli:main_monitor"
mojiang-report = "mojiang_chaogu.cli:main_report"
mojiang-cache = "mojiang_chaogu.cli:main_cache"
mojiang-semicon = "mojiang_chaogu.cli:main_semicon"
mojiang-flows = "mojiang_chaogu.cli:main_flows"
mojiang-web = "mojiang_chaogu.cli:main_web"
mojiang-earnings = "mojiang_chaogu.earnings.cli:main_earnings"
mojiang-agent = "mojiang_chaogu.cli:main_agent"
mojiang-memory = "mojiang_chaogu.cli:main_memory"
mojiang-mcp = "mojiang_chaogu.agent.mcp_server:main_mcp"
mojiang-chaogu = "mojiang_chaogu.cli:main"
mojiang = "mojiang_chaogu.cli:main_mojiang"
mojiang-tui = "mojiang_chaogu.tui.app:main"
mojiang-channel = "mojiang_chaogu.cli:main_channel"
mojiang-connect = "mojiang_chaogu.cli:main_connect"
mojiang-doctor = "mojiang_chaogu.cli:main_doctor"
mojiang-setup = "mojiang_chaogu.setup:main_setup"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
    "types-pyyaml",
    "httpx>=0.27",  # FastAPI 测试客户端
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Runtime output must never enter a release artifact; market-monitoring-test is a
# local experimental Skill, not a bundled product Skill. All six catalog plugins
# under bundled_skills/ are part of the installable project package.
exclude = [
    "/output/**",
    "/src/mojiang_chaogu/bundled_skills/market-monitoring-test/**",
]

[tool.hatch.build.targets.sdist]
# Hatch's sdist file selection follows repository ignore rules. Keep the
# catalog plugins explicit so wheel builds from sdist remain complete.
force-include = {"src/mojiang_chaogu/bundled_skills/mojiang-onboard" = "src/mojiang_chaogu/bundled_skills/mojiang-onboard", "src/mojiang_chaogu/bundled_skills/mojiang-research" = "src/mojiang_chaogu/bundled_skills/mojiang-research", "src/mojiang_chaogu/bundled_skills/mojiang-strategy" = "src/mojiang_chaogu/bundled_skills/mojiang-strategy", "src/mojiang_chaogu/bundled_skills/market-watch-loop" = "src/mojiang_chaogu/bundled_skills/market-watch-loop", "src/mojiang_chaogu/bundled_skills/basket-analysis" = "src/mojiang_chaogu/bundled_skills/basket-analysis", "src/mojiang_chaogu/bundled_skills/food-security-analysis" = "src/mojiang_chaogu/bundled_skills/food-security-analysis"}

[tool.hatch.build.targets.wheel]
packages = ["src/mojiang_chaogu"]

[tool.hatch.version]
path = "src/mojiang_chaogu/version.py"

[tool.ruff]
line-length = 100
target-version = "py312"
# These two directories are independently versioned, distributable Skill
# payloads from the public Plugins Store; their scripts are not application
# modules and should be linted by their own release process.
exclude = [
    "src/mojiang_chaogu/bundled_skills/basket-analysis/**",
    "src/mojiang_chaogu/bundled_skills/food-security-analysis/**",
    "site/install-skill.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
# E501: line too long (允许多行 dataclass 字段长)
# RUF003: ambiguous unicode characters — 中文 docstring/注释必然含全角符号
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
# Store payload scripts are standalone Skill assets, not imported project code.
exclude = "src/mojiang_chaogu/bundled_skills/(basket-analysis|food-security-analysis)/"

[[tool.mypy.overrides]]
module = [
    "efinance", "pandas", "pandas.*", "rich", "retry", "tqdm", "multitasking",
    "jsonpath", "requests", "requests.*",
    "qrcode", "qrcode.*",
    "sqlite_vec", "tiktoken",
    "sqlalchemy", "sqlalchemy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["fastapi", "uvicorn", "starlette", "httpx", "openai", "openai.*", "mcp", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "network: requires live efinance API access (东财接口)",
]

[tool.coverage.run]
branch = true
source = ["mojiang_chaogu"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
fail_under = 70
