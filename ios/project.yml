name: MojiangChaogu
options:
  bundleIdPrefix: io.github.cjs5725
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: ""
targets:
  MojiangChaogu:
    type: application
    platform: iOS
    sources:
      - MojiangChaogu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cjs5725.mojiangchaogu
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 墨匠工坊
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你的墨匠工坊数据服务与实时行情。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 用于语音指挥 AI 助手。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 将你的语音指令转成文字并交给 AI 助手。
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: iPhone Developer
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - MojiangChaoguTests
  MojiangChaoguTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MojiangChaoguTests
    dependencies:
      - target: MojiangChaogu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cjs5725.mojiangchaogu.tests
